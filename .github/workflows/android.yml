
name: Build PayClone APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip PayClone-Android-Project.zip
          cd PayClone
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PayClone-debug-apk
          path: PayClone/app/build/outputs/apk/debug/app-debug.apk
          
